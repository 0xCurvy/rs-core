language = "C"
header = """// Generated by cbindgen from bindings/ffi. Do not edit by hand.
// Out-pointers require valid writable storage; alignment is not required.
// Object frees return status and wait for an active operation on that handle.
// Copy curvy_last_error before the next fallible call, including successful calls.
// All C string inputs must be NUL terminated within their readable allocation.
"""
include_guard = "CURVY_FFI_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"

[export]
prefix = ""
include = ["CurvyBytes", "CurvyStatus"]

[enum]
prefix_with_name = true

[parse]
parse_deps = false

