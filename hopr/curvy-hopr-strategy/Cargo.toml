[package]
name = "curvy-hopr-strategy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# L6 consumer (plan §3): `impl hopr_strategy::Strategy for CurvyStrategy`. A thin policy
# shell around `Arc<CurvyClient>` (the M2 SDK). Needs NO hopr-api node traits — it talks
# to its own chain backend — so its bounds are just `Strategy + Send`, exactly what
# hoprnet's own `test_multi_strategy_accepts_external_strategy` proves composes.

[dependencies]
hopr-strategy = { workspace = true }
# curvy-core is reached via `curvy_sdk::curvy_core` (see hopr/Cargo.toml note) — no direct
# path-dep on ../crates/core, which would pull the rs-core root workspace into the build.
curvy-sdk = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
