[package]
name = "curvy-hopr-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Standalone runner that stands in for the hoprd composition site (which lives in the
# separate `hoprnet/hoprd` repo). It builds a real `CurvyClient` against the live
# `poc/blokli-env` stack, pre-seeds a note to the strategy's account, then composes
# `hopr_strategy::MultiStrategy::new(vec![CurvyStrategy, HeartbeatStrategy, FaultySibling])`
# and runs it — demonstrating (a) the policy firing a REAL settle via blokli on schedule
# and (b) failure isolation with a real panicking sibling.

[[bin]]
name = "curvy-hopr-runner"
path = "src/main.rs"

[dependencies]
curvy-hopr-strategy = { path = "../curvy-hopr-strategy" }
hopr-strategy = { workspace = true }
curvy-sdk = { workspace = true }
curvy-chain-blokli = { workspace = true }
curvy-chain-rpc = { workspace = true }
curvy-e2e = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
