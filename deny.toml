# cargo-deny policy for the Curvy Rust core.
# Run: cargo deny --manifest-path packages/core-rs/Cargo.toml check
# (cargo-deny is a dev tool; install with `cargo install cargo-deny` — it does not
#  enter the crate's dependency tree.)

[advisories]
# Deny on any RustSec advisory; CI fails if a vulnerable version is in the lockfile.
version = 2
yanked = "deny"
ignore = [
  # `paste` is archived/unmaintained (informational advisory, NOT a vulnerability).
  # It is a tiny build-time proc-macro pulled transitively by arkworks (ark-ff →
  # paste), with no safe upgrade available. No runtime/security impact. Re-evaluate
  # when arkworks drops it (e.g. for `pastey`).
  "RUSTSEC-2024-0436",
]

[bans]
# Keep the tree lean and auditable: no untrusted/duplicate sprawl.
multiple-versions = "warn"
wildcards = "deny"          # forbid "*" version reqs on EXTERNAL deps
allow-wildcard-paths = true # ...but allow internal workspace path deps (curvy-core)

[licenses]
version = 2
# Permissive licenses only — exactly those present in the dependency tree (arkworks
# + RustCrypto are MIT/Apache-2.0; a few BSD-3-Clause / Unicode-3.0). Add to this
# list (never remove the gate) if a new vetted dependency introduces another.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.9

[sources]
# Only crates.io. No git or alternative registries (supply-chain control).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
