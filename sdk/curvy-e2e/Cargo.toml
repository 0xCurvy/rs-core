[package]
name = "curvy-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# L6-ish consumer — the runnable end-to-end against the live blokli-env stack.
# Assembles the adapter mix behind the CurvyClient and drives shield → commit →
# aggregate(via blokli) → scan, printing a per-step PASS/FAIL ledger.

[[bin]]
name = "curvy-e2e"
path = "src/main.rs"

[dependencies]
curvy-core = { workspace = true }
curvy-sdk = { path = "../curvy-sdk" }
curvy-chain-api = { path = "../curvy-chain-api" }
curvy-chain-rpc = { path = "../curvy-chain-rpc" }
curvy-chain-blokli = { path = "../curvy-chain-blokli" }
curvy-types = { path = "../curvy-types" }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
