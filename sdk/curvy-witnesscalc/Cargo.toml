# L0.5 — the witness-calculator seam, born from spikes/m1-prove-verify. One
# `WitnessCalculator` trait + a graph-based pure-Rust impl (iden3 circom-witnesscalc);
# per-circuit graph/zkey artifacts pinned by sha256; the interim `build_pending_commitment`
# input massaging (documented as the stopgap for the core `to_circuit_input()` fix).
# Depends on curvy-prover for the Groth16 leg — one crate turns (input JSON) → (proof).

[dependencies]
curvy-core = { workspace = true }
curvy-prover = { workspace = true }
ark-bn254 = { workspace = true }
circom-witnesscalc = "0.3.0"
serde_json = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
anyhow = { workspace = true }
