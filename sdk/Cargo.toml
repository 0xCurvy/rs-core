[workspace]
resolver = "2"
members = [
    "curvy-types",
    "curvy-chain-api",
    "curvy-abi",
    "curvy-witnesscalc",
    "curvy-chain-blokli",
    "curvy-chain-rpc",
    "curvy-sdk",
    "curvy-e2e",
]

# DETACHED workspace (own [workspace] table) — deliberately NOT a member of the
# rs-core root workspace, and it never touches rs-core's root Cargo.toml/deny.toml.
# It path-depends on ../crates/core and ../crates/prover (the L0 layer). Mirrors the
# detached-workspace stance of spikes/m1-prove-verify and poc/blokli-env/rs.

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
curvy-core = { path = "../crates/core" }
curvy-prover = { path = "../crates/prover" }

# L0 arkworks line (must match curvy-prover's 0.5.0 — Fr values cross the boundary).
ark-bn254 = { version = "0.5.0", features = ["std"] }
ark-ff = { version = "0.5.0", features = ["std"] }

# EVM adapter layer only (curvy-abi / curvy-chain-rpc / curvy-chain-blokli).
alloy = { version = "1", features = ["full"] }
# GraphQL/HTTP to bloklid :8080.
reqwest = { version = "0.13", default-features = false, features = ["json"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
hex = "0.4"
num-bigint = "0.4"
sha3 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
