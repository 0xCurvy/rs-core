# Base bloklid config baked into the `curvy-bloklid-anvil` single-container image.
#
# This is the STATIC part. At container start the entrypoint appends the `[contracts]`
# section (emitted by the forked `blokli-contract-deployer`) and writes the assembled
# file to ${DATA_DIR}/config.toml, which `bloklid -c` then loads.
#
# Differences vs poc/blokli-env/config/bloklid.base.toml (the multi-service compose):
#   - rpc_url points at the IN-CONTAINER anvil (127.0.0.1), not the compose "anvil" host.
# Curvy's [curvy_contracts] is NEVER merged here (bloklid's Config is
# #[serde(deny_unknown_fields)] and would refuse to start); it lives in its own file
# under the mounted /shared dir. See README.md.

data_directory          = "/data"
network                 = "anvil-localhost"   # resolves the HOPR contract set + start block from hopr-bindings
rpc_url                 = "http://127.0.0.1:8545"
max_rpc_requests_per_sec = 0

[database]
type            = "sqlite"
index_path      = "/data/bloklid-index.db"
logs_path       = "/data/bloklid-logs.db"
max_connections = 10

[indexer]
fast_sync            = false
enable_logs_snapshot = false
enable_safe_indexing = true

[indexer.subscription]
event_bus_capacity       = 100
shutdown_signal_capacity = 10
batch_size               = 50

[api]
bind_address       = "0.0.0.0:8080"
enabled            = true
playground_enabled = true

[api.health]
# Generous lag headroom so readiness does not flap on 1s blocks.
max_indexer_lag          = 20
timeout                  = "5s"
readiness_check_interval = "5s"
