# Curvy x HOPR/blokli — M2 smoke tooling.
#
# DETACHED workspace (own [workspace] table) — deliberately NOT a member of the
# rs-core root workspace, so this alloy/reqwest dependency set never touches
# rs-core's exact-pinned, cargo-deny-gated policy. Mirrors spikes/m1-prove-verify.
#
# NOTE: the former `curvy-init` bin (the two mandatory post-deploy calls +
# read-back) has been FOLDED into `sdk/curvy-deployer` (which now deploys AND
# initialises the whole suite in one Rust binary). Only the blokli tx-submission
# smoke remains here.
[package]
name = "curvy-poc-m2"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "blokli-smoke"
path = "src/bin/blokli-smoke.rs"

[dependencies]
# EVM: provider/signer/contract/sol! + raw-tx build & 2718 encoding.
alloy = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# GraphQL over HTTP to bloklid :8080 (TLS not needed for localhost).
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"

[profile.release]
opt-level = 2
