---
# Curvy x HOPR/blokli — M2 local stack.
#
#   anvil (foundry)  :8545  — dev chain, chain id 31337, 1s blocks, 10 funded accounts
#   bloklid          :8080  — HOPR blokli indexer + GraphQL (production image, pinned by digest)
#
# One-shot helpers (profile "tools", started explicitly by run.sh via
# `docker compose run --rm`):
#   hopr-deploy — deploys the HOPR contract suite via the image's
#                 `blokli-contract-deployer`, then assembles generated/config.toml
#   seed-tx     — sends one plain tx so bloklid's verify_rpc_capabilities() has a
#                 transaction to trace (mirrors blokli's own smoke compose)
#
# See README.md for the full flow and provenance.

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest   # mutable tag; resolved digest recorded in README
    container_name: curvy-blokli-anvil
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
      # AUTOMINE (no --block-time): both deployers use alloy — the HOPR
      # blokli-contract-deployer's `.watch()` and curvy-deployer's `.get_receipt()`
      # each need their tx mined, and automine mines per-tx. (The old Hardhat/Ignition
      # interval-mining toggle is GONE now that Curvy deploys via alloy under automine.)
      # chain id defaults to 31337 (matches both HOPR anvil-localhost and Curvy localnet).
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks: [curvy-blokli]

  bloklid:
    image: europe-west3-docker.pkg.dev/hoprassociation/docker-images/bloklid:latest@sha256:b76b2a142a2fa161c2dc79cb9f01c3cb6f668eb841c6206748ad3259330147fc
    container_name: curvy-blokli-bloklid
    depends_on:
      anvil:
        condition: service_healthy
    # config.toml is produced by the hopr-deploy one-shot into ./generated before
    # this service is started (run.sh enforces the order).
    volumes:
      - ./generated:/shared:ro
      - bloklid_data:/data
    environment:
      RUST_LOG: "info,blokli_chain_indexer=debug"
    command: ["-c", "/shared/config.toml"]
    ports:
      - "8080:8080"
    # NOTE: the bloklid image ships no curl/wget, so there is no container-level
    # healthcheck; run.sh polls http://localhost:8080/readyz from the host.
    networks: [curvy-blokli]

  hopr-deploy:
    image: europe-west3-docker.pkg.dev/hoprassociation/docker-images/bloklid:latest@sha256:b76b2a142a2fa161c2dc79cb9f01c3cb6f668eb841c6206748ad3259330147fc
    profiles: ["tools"]
    depends_on:
      anvil:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[hopr-deploy] deploying HOPR contract suite via blokli-contract-deployer..."
        blokli-contract-deployer --rpc-url http://anvil:8545 --output /shared/contracts.toml
        echo "[hopr-deploy] assembling /shared/config.toml (base + [contracts])..."
        { cat /base/bloklid.base.toml; echo; cat /shared/contracts.toml; } > /shared/config.toml
        echo "[hopr-deploy] done. contracts:"
        cat /shared/contracts.toml
    volumes:
      - ./config:/base:ro
      - ./generated:/shared
    networks: [curvy-blokli]

  seed-tx:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles: ["tools"]
    depends_on:
      anvil:
        condition: service_healthy
    entrypoint: ["cast"]
    command:
      - "send"
      - "--rpc-url"
      - "http://anvil:8545"
      - "--private-key"
      - "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      - "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      - "--value"
      - "1"
    networks: [curvy-blokli]

volumes:
  bloklid_data:

networks:
  curvy-blokli:
    driver: bridge
