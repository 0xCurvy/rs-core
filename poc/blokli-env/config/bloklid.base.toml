# Base bloklid config for the Curvy x HOPR/blokli M2 environment.
#
# This is the STATIC part. At `run.sh` time the `hopr-deploy` one-shot appends a
# `[contracts]` section (emitted by the image's `blokli-contract-deployer`) and
# writes the assembled file to `generated/config.toml`, which the `bloklid`
# service mounts. See README.md.
#
# Modeled on blokli's own docker/blokli-anvil-entrypoint.sh (sqlite, single
# container) and tests/smoke/config-smoke.toml.

data_directory          = "/data"
network                 = "anvil-localhost"   # resolves HOPR contract set + start block from hopr-bindings
rpc_url                 = "http://anvil:8545"
max_rpc_requests_per_sec = 0

[database]
type            = "sqlite"
index_path      = "/data/bloklid-index.db"
logs_path       = "/data/bloklid-logs.db"
max_connections = 10

[indexer]
fast_sync            = false
enable_logs_snapshot = false
enable_safe_indexing = true

[indexer.subscription]
event_bus_capacity       = 100
shutdown_signal_capacity = 10
batch_size               = 50

[api]
bind_address       = "0.0.0.0:8080"
enabled            = true
playground_enabled = true

[api.health]
# Generous lag headroom so readiness does not flap on a busy host with 1s blocks.
max_indexer_lag          = 20
timeout                  = "5s"
readiness_check_interval = "5s"
