<!doctype html>
<meta charset="utf-8" />
<title>curvy-core scan bench — ST vs rayon threads</title>
<h3>curvy-core wasm scan: single-thread vs rayon threads</h3>
<pre id="out"></pre>
<div id="done"></div>
<script type="module">
  import stInit, * as st from "/core-pkg-st/curvy_wasm.js";
  import mtInit, { initThreadPool, scan as mtScan, new_meta, send } from "/core-pkg/curvy_wasm.js";

  const params = new URLSearchParams(location.search);
  const N = Number(params.get("n")) || 4096;
  const threads = Number(params.get("threads")) || Math.min(navigator.hardwareConcurrency, 8);
  const out = document.getElementById("out");
  const log = (m) => {
    out.textContent += m + "\n";
    console.log("[bench] " + m);
  };

  const time = (f) => {
    const t0 = performance.now();
    const r = f();
    return [performance.now() - t0, r];
  };

  async function run() {
    log(`crossOriginIsolated: ${crossOriginIsolated} | n=${N} | threads=${threads} | hw=${navigator.hardwareConcurrency}`);
    await stInit();
    await mtInit();
    await initThreadPool(threads);

    // 64 real announcements tiled to N — identical per-announcement work,
    // without paying N pairing-heavy sends up front.
    const [k, v, K, V] = new_meta();
    const [, , oK, oV] = new_meta(); // stranger, for the non-matching case
    const make = (bk, bv) => {
      const base = Array.from({ length: 64 }, () => send(bk, bv)); // [r, R, viewTag, spk]
      return {
        rs: Array.from({ length: N }, (_, i) => base[i % 64][1]),
        tags: Array.from({ length: N }, (_, i) => base[i % 64][2]),
      };
    };
    const match = make(K, V);
    const miss = make(oK, oV);

    for (const [label, data] of [["matching", match], ["non-matching", miss]]) {
      st.scan(k, v, data.rs, data.tags); // warm
      const [stMs, stOut] = time(() => st.scan(k, v, data.rs, data.tags));
      mtScan(k, v, data.rs, data.tags); // warm
      const [mtMs, mtOut] = time(() => mtScan(k, v, data.rs, data.tags));
      // sparse ScanMatch[] — serialize (index, keys) triples for the equality check
      const flat = (o) => JSON.stringify(o.map((m) => [m.index, m.spendingPubKey, m.spendingPrivKey]));
      const equal = flat(stOut) === flat(mtOut);
      log(
        `scan ${N} ${label.padStart(12)}: st ${stMs.toFixed(0)}ms (${((stMs * 1000) / N).toFixed(0)}µs/ann)` +
          ` | mt(${threads}) ${mtMs.toFixed(0)}ms (${((mtMs * 1000) / N).toFixed(1)}µs/ann)` +
          ` | ${(stMs / mtMs).toFixed(1)}x | ${stOut.length} matches, identical: ${equal}`,
      );
    }
    document.getElementById("done").textContent = "DONE";
  }

  run().catch((e) => {
    log("ERROR: " + (e.stack || e));
    document.getElementById("done").textContent = "ERROR";
  });
</script>
