[package]
name = "curvy-prover"
description = "Authenticated Circom witness and Groth16 prover for the Curvy protocol"
keywords = ["curvy", "groth16", "snarkjs", "zero-knowledge", "bn254"]
categories = ["cryptography"]
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/curvy-prover"
exclude = ["js/**", "MOBILE_HARNESS.md"]

[package.metadata.docs.rs]
all-features = true
targets = []
rustdoc-args = ["-D", "warnings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ark-bn254 = { workspace = true, default-features = false, features = ["curve"] }
ark-ec = { workspace = true, default-features = false }
ark-ff = { workspace = true, default-features = false }
ark-groth16 = { workspace = true, default-features = false }
ark-poly = { workspace = true, default-features = false }
ark-relations = { workspace = true, default-features = false }
ark-serialize = { workspace = true, default-features = false }
ark-std = { workspace = true, default-features = false }
byteorder.workspace = true
curvy-witness = { version = "=0.1.0-rc.4", path = "../witness" }
getrandom.workspace = true
num-bigint.workspace = true
rayon = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-rayon = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["std"]
bench = ["sparrow"]
std = [
  "ark-bn254/std",
  "ark-ec/std",
  "ark-ff/std",
  "ark-groth16/std",
  "ark-poly/std",
  "ark-relations/std",
  "ark-serialize/std",
  "ark-std/getrandom",
  "ark-std/std",
]
# Opt into Curvy's ark-groth16 0.6-compatible proof assembly and MSM scheduler.
# Do not enable ark-ec/parallel or ark-groth16/parallel: ark-ec 0.6 constructs
# private Rayon pools inside large MSMs, which wasm-bindgen-rayon cannot spawn.
# Curvy schedules those MSMs on the host's existing pool; FFT and field work
# stay parallel. Without this feature, the ordinary prover calls stock serial
# ark-groth16 directly.
parallel = [
  "dep:rayon",
  "ark-ff/parallel",
  "ark-poly/parallel",
  "ark-std/parallel",
]
signet-v2 = ["curvy-witness/signet-v2"]
sparrow = ["signet-v2", "curvy-witness/sage"]
wasm = ["dep:wasm-bindgen"]
wasm-threads = ["wasm", "parallel", "dep:wasm-bindgen-rayon"]

[[bin]]
name = "curvy-native-prover"
path = "src/bin/curvy-native-prover.rs"
required-features = ["std"]

[[example]]
name = "derive_sage_cache"
required-features = ["sparrow"]

[[example]]
name = "zkey_chunk_manifest"
required-features = ["sparrow"]
