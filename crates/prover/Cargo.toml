[package]
name = "curvy-prover"
description = "Authenticated Circom witness and Groth16 prover for the Curvy protocol"
keywords = ["curvy", "groth16", "snarkjs", "zero-knowledge", "bn254"]
categories = ["cryptography"]
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/curvy-prover"

[package.metadata.docs.rs]
all-features = true
targets = []
rustdoc-args = ["-D", "warnings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ark-bn254 = { workspace = true, default-features = false, features = ["curve"] }
ark-ec = { workspace = true, default-features = false }
ark-ff = { workspace = true, default-features = false }
ark-groth16 = { workspace = true, default-features = false }
ark-poly = { workspace = true, default-features = false }
ark-relations = { workspace = true, default-features = false }
ark-serialize = { workspace = true, default-features = false }
ark-std = { workspace = true, default-features = false }
byteorder.workspace = true
curvy-witness = { version = "=0.1.0-rc.1", path = "../witness" }
getrandom.workspace = true
num-bigint.workspace = true
rayon = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-rayon = { workspace = true, optional = true }

[features]
default = ["std", "parallel"]
std = [
  "ark-bn254/std",
  "ark-ec/std",
  "ark-ff/std",
  "ark-groth16/std",
  "ark-poly/std",
  "ark-relations/std",
  "ark-serialize/std",
  "ark-std/getrandom",
  "ark-std/std",
]
parallel = [
  "dep:rayon",
  "ark-ec/parallel",
  "ark-ff/parallel",
  "ark-groth16/parallel",
  "ark-poly/parallel",
  "ark-std/parallel",
]
wasm = ["dep:wasm-bindgen"]
wasm-threads = ["wasm", "parallel", "dep:wasm-bindgen-rayon"]

[[bin]]
name = "curvy-native-prover"
path = "src/bin/curvy-native-prover.rs"
required-features = ["std"]
