name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref. Superseded PR pushes are cancelled; main is left
# alone so every commit on the release branch keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  ffi:
    name: C ABI binding and surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.94.0
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cbindgen@0.29.4
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: cargo test --locked -p curvy-ffi
      - run: scripts/build.sh wasm-nodejs
      - run: cbindgen -q --verify --config bindings/ffi/cbindgen.toml --lockfile Cargo.lock --output bindings/ffi/include/curvy.h bindings/ffi
      - run: node scripts/check-ffi-surface.mjs
      - run: node scripts/check-ffi-vectors.mjs

  node-native:
    name: Node-API binding (Linux x64, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.94.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: bindings/node
      - run: npm run build -- --target x86_64-unknown-linux-gnu -- --locked
        working-directory: bindings/node
      - run: npm test
        working-directory: bindings/node
      - run: npm run package:preview
        working-directory: bindings/node

  # Builds the binding natively with MSVC and runs the Node suite on Windows.
  # This is not the shipped Windows artifact: releases cross-compile that one
  # with cargo-xwin in bindings/node/Dockerfile.release, which skips npm test.
  node-native-windows:
    name: Node-API binding (Windows x64, Node 22)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash: PowerShell's npm.ps1 shim can swallow the `--` separators.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.94.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: bindings/node
      - run: npm run build -- --target x86_64-pc-windows-msvc -- --locked
        working-directory: bindings/node
      - run: npm test
        working-directory: bindings/node

  # Formatting, generated-table, documentation, dependency-policy, artifact
  # tooling, native release build and publish checks. The feature-set test and
  # clippy commands run in parallel in the rust-checks matrix below.
  rust:
    name: Rust quality and native build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.94.0
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo run --locked -p curvy-benchmarks --bin generate_poseidon_optimized -- --check
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Both artifact-pipeline suites drive this validator example
      # (target/debug/examples/artifact_manifest_check).
      - run: cargo build -p curvy-prover --example artifact_manifest_check --features sage --locked
      - run: python3 tools/artifacts/test_release.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --prefix tools/artifacts --ignore-scripts
      - run: npm audit --prefix tools/artifacts --audit-level=high
      - run: python3 tools/artifacts/test_pipeline.py
      - run: cargo install cargo-deny --version 0.19.9 --locked
      - run: cargo deny check
      - run: scripts/build.sh native
      - name: Check publish contents
        run: |
          for package in curvy-core curvy-witness curvy-prover curvy-wasm; do
            contents="$(cargo package -p "$package" --list --allow-dirty)"
            grep -qx LICENSE <<<"$contents"
            grep -qx README.md <<<"$contents"
            grep -qx THIRD-PARTY-NOTICES.md <<<"$contents"
            if grep -q '^js/' <<<"$contents"; then
              echo "::error::$package includes source-repository JavaScript tooling"
              exit 1
            fi
          done
          prover_contents="$(cargo package -p curvy-prover --list --allow-dirty)"
          grep -qx SPARROW.md <<<"$prover_contents"
          grep -qx examples/artifact_manifest_check.rs <<<"$prover_contents"
          grep -qx examples/derive_sage_cache.rs <<<"$prover_contents"
          grep -qx examples/zkey_chunk_manifest.rs <<<"$prover_contents"
          if grep -Eq 'MOBILE_HARNESS|^examples/.*bench\.rs$|native_window_sweep' <<<"$prover_contents"; then
            echo "::error::curvy-prover includes harness or benchmark example files"
            exit 1
          fi
          cargo package -p curvy-core --locked --no-verify
          cargo package -p curvy-witness --locked --no-verify

  # Every test and clippy feature set, split across runners. Each entry runs its
  # commands in order and stops at the first failure, like consecutive steps.
  # Entries that mix serial and `parallel` sets compile two dependency feature
  # sets; they are grouped so each comment stays with the commands it explains.
  rust-checks:
    name: Rust (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace tests and clippy
            id: workspace
            components: clippy
            run: |
              cargo check --workspace --all-targets --locked
              cargo test --workspace --all-targets --locked
              cargo test --workspace --doc --all-features --locked
              cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
              # --all-features unifies `parallel` everywhere, so serial
              # cfg(not(feature = "parallel")) arms and default-only code are never
              # linted above. Lint the shipped and opt-in combinations directly.
              cargo clippy -p curvy-prover --all-targets --features sparrow --locked -- -D warnings
              cargo clippy -p curvy-prover --all-targets --features scratch --locked -- -D warnings
              cargo clippy -p curvy-prover --all-targets --no-default-features --locked -- -D warnings
              cargo clippy -p curvy-core --all-targets --no-default-features --locked -- -D warnings
              cargo clippy -p curvy-core --all-targets --features parallel --locked -- -D warnings
          - name: core, witness and prover defaults
            id: defaults
            components: ""
            run: |
              # Keep the direct Poseidon schedule buildable as an independent oracle.
              cargo test -p curvy-core --no-default-features --locked
              # tools/leakage enables curvy-core `leakage`, so every --workspace run
              # unifies it. Test the published defaults in isolation, and execute the
              # rayon arms (bulk Merkle parents, announcement scans) that only
              # `parallel` compiles.
              cargo test -p curvy-core --locked
              cargo test -p curvy-core --features parallel --locked
              # Workspace feature unification includes the internal SIGNET producer.
              # These isolated commands prove the published defaults still refuse v2
              # and use stock serial ark-groth16.
              cargo test -p curvy-witness --no-default-features --locked
              # SAGE without SIGNET v2 is what the C ABI and Node bindings ship.
              cargo test -p curvy-witness --features sage --locked
              cargo test -p curvy-prover --locked
          - name: prover sparrow and compact-matrix
            id: prover-sparrow-compact
            components: ""
            run: |
              # `sparrow` is intentionally opt-in, so the default workspace test does
              # not select its integration suite or examples.
              cargo test -p curvy-prover --features sparrow --all-targets --locked
              cargo test -p curvy-prover --features parallel,sparrow --all-targets --locked
              # `compact-matrix` swaps in a hand-rolled two-pass CSR zkey parser and its
              # own QAP path, neither of which the default workspace test reaches. Cover
              # the serial and parallel proof assemblies it can pair with.
              cargo test -p curvy-prover --features compact-matrix --all-targets --locked
              cargo test -p curvy-prover --features compact-matrix,parallel,sparrow --all-targets --locked
          - name: prover scratch, manifest and single-pass
            id: prover-scratch-manifest
            components: ""
            run: |
              # Execute buffer-reuse success/error/unwind tests, not just compilation.
              cargo test -p curvy-prover --features scratch,sage,zkey-manifest --all-targets --locked
              cargo test -p curvy-prover --features scratch,parallel,sparrow --all-targets --locked
              cargo test -p curvy-prover --features zkey-manifest --all-targets --locked
              # `zkey-single-pass` replaces the seek-and-rehash zkey reader with one
              # forward digesting walk. Cover it alone and paired with `compact-matrix`,
              # whose two-pass CSR parser makes the walk buffer section 4.
              cargo test -p curvy-prover --features zkey-single-pass --all-targets --locked
              cargo test -p curvy-prover --features zkey-single-pass,compact-matrix --all-targets --locked
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.94.0
          components: ${{ matrix.components }}
          # rust-cache keys on the job id, which every entry shares. A per-entry
          # key keeps each feature set's target directory from evicting another's.
          cache-key: ${{ matrix.id }}
      # -x echoes each command before it runs, so the log shows which one failed.
      - shell: bash --noprofile --norc -xeo pipefail {0}
        run: ${{ matrix.run }}

  wasm-portable:
    name: Portable WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.94.0
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --test crates/prover/js/*.test.mjs scripts/*.test.mjs
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: scripts/build.sh wasm-nodejs
      - run: node crates/wasm/smoke-test.cjs
      - name: Check production prover bindings exclude SPARROW and SAGE
        run: |
          node -e 'const wasm = require("./crates/prover/pkg-node/curvy_prover.js"); if (typeof wasm.WasmResidentProver !== "function" || typeof wasm.WasmWitnessGraph !== "function" || wasm.WasmStreamingProver !== undefined || wasm.sageCacheVersion !== undefined) process.exit(1)'
      # Run a real self-verified Groth16 proof through each Node build, not just
      # an export check: pinned fixture, publicSignals ["33"], VK digest equal
      # to the snarkjs export, and a corrupted key refused.
      - run: node tools/browser/node-proof-check.mjs
      - run: node crates/prover/js/signet-v2-cross-target.cjs --expect-v2-disabled
      - run: scripts/build-wasm.sh nodejs --signet-v2
      - name: Check standalone SIGNET v2 bindings
        run: |
          node -e 'const wasm = require("./crates/prover/pkg-node/curvy_prover.js"); if (typeof wasm.WasmWitnessGraph !== "function" || wasm.WasmStreamingProver !== undefined || wasm.sageCacheVersion !== undefined) process.exit(1)'
      - run: node tools/browser/node-proof-check.mjs
      - run: node crates/prover/js/signet-v2-cross-target.cjs
      - run: scripts/build-wasm.sh nodejs --sparrow
      - name: Check opt-in SPARROW and SAGE bindings
        run: |
          node -e 'const wasm = require("./crates/prover/pkg-node/curvy_prover.js"); const streaming = wasm.WasmStreamingProver; if (typeof wasm.WasmResidentProver !== "function" || typeof streaming !== "function" || typeof wasm.sageCacheVersion !== "function" || typeof streaming.fromSignetWithConfig !== "function" || typeof streaming.prototype.compiledSageProgram !== "function" || wasm.benchSha256 !== undefined) process.exit(1)'
      - run: node tools/browser/node-proof-check.mjs
      # The browser package (scripts/build.sh wasm-web) is built and proved by
      # the wasm-browser job below.
      - run: scripts/build.sh wasm-bundler

  # Build every browser configuration that ships in @0xcurvy/rs-core-wasm with
  # the exact release command (release.yml.disabled, scripts/build.sh npm) and
  # prove with it in Chromium and Firefox. compact-matrix is an opt-in variant
  # kept proven alongside.
  wasm-browser:
    name: Browser WASM proof (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: threaded release
            toolchain: nightly-2026-07-03
            components: rust-src
            build: scripts/build.sh wasm-web-threads
            mode: threaded
            artifact: wasm-web-threads
            artifact-dir: pkg-web-threads
          - name: threaded compact-matrix
            toolchain: nightly-2026-07-03
            components: rust-src
            build: scripts/build-wasm.sh web --threads --compact-matrix
            mode: threaded
          - name: portable release
            toolchain: 1.94.0
            components: ""
            build: scripts/build.sh wasm-web
            mode: portable
            artifact: wasm-web
            artifact-dir: pkg-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.components }}
          target: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: ${{ matrix.build }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - run: npm ci --prefix tools/browser --ignore-scripts
      - run: npx --prefix tools/browser playwright install --with-deps chromium firefox
      - run: node tools/browser/check.mjs ${{ matrix.mode }}
      # Hand the proved release builds to the npm-package job.
      - if: matrix.artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          # Both paths live under crates/, so the artifact is rooted there.
          path: |
            crates/wasm/${{ matrix.artifact-dir }}
            crates/prover/${{ matrix.artifact-dir }}
          if-no-files-found: error
          retention-days: 3

  # Assemble, pack, install, and smoke-test the npm tarball exactly as the
  # release workflow does, from the builds proved above. The smoke test runs a
  # real proof through the packed portable prover entry.
  npm-package:
    name: npm package (pack and smoke)
    needs: wasm-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-web
          path: crates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-web-threads
          path: crates
      - run: node scripts/build-npm.mjs --pack
      - name: Smoke-test the packed tarball
        run: |
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/0xcurvy-rs-core-wasm-*.tgz
          node "$GITHUB_WORKSPACE/scripts/smoke-npm.mjs" "$install_dir"

  parser-fuzz:
    name: Authenticated parser fuzz smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly-2026-07-03
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-07-03 fetch --manifest-path fuzz/Cargo.toml --locked
      # The fuzz crate's default `compact-matrix` feature selects the compact CSR
      # zkey parser; --no-default-features builds the nested parse_matrices path
      # that Rust, C and WASM ship by default. Build every target both ways; the
      # second build recompiles only curvy-prover and the fuzz binaries.
      - run: CARGO_NET_OFFLINE=true cargo +nightly-2026-07-03 fuzz build --no-default-features
      - run: CARGO_NET_OFFLINE=true cargo +nightly-2026-07-03 fuzz build
      - run: git diff --exit-code -- fuzz/Cargo.lock
      - name: Exercise parsers after digest authentication
        run: |
          for target in graph sage prover_formats input_json; do
            CARGO_NET_OFFLINE=true cargo +nightly-2026-07-03 fuzz run "$target" -- -max_total_time=45 -timeout=10 -rss_limit_mb=1024 -max_len=65536
          done
      # prover_formats is the only target that uses curvy-prover. It starts from
      # the corpus the compact run above just grew.
      - name: Exercise the nested zkey matrix parser
        run: CARGO_NET_OFFLINE=true cargo +nightly-2026-07-03 fuzz run --no-default-features prover_formats -- -max_total_time=45 -timeout=10 -rss_limit_mb=1024 -max_len=65536
