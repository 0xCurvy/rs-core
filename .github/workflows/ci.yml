name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality and native build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo install cargo-deny --version 0.19.9 --locked
      - run: cargo deny check
      - run: scripts/build.sh native
      - name: Check publish contents
        run: |
          for package in curvy-core curvy-witness curvy-prover curvy-wasm; do
            contents="$(cargo package -p "$package" --list --allow-dirty)"
            grep -qx LICENSE <<<"$contents"
            grep -qx README.md <<<"$contents"
            grep -qx THIRD-PARTY-NOTICES.md <<<"$contents"
          done
          cargo package -p curvy-core --locked --no-verify
          cargo package -p curvy-witness --locked --no-verify

  wasm-portable:
    name: Portable WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: scripts/build.sh wasm-nodejs
      - run: node crates/wasm/smoke-test.cjs
      - name: Check prover bindings
        run: |
          node -e 'const wasm = require("./crates/prover/pkg-node/curvy_prover.js"); if (typeof wasm.WasmCircuitProver !== "function") process.exit(1)'
      - run: scripts/build.sh wasm-web
      - run: scripts/build.sh wasm-bundler

  wasm-threaded:
    name: Threaded WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-03
          components: rust-src
          target: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: scripts/build.sh wasm-web-threads
