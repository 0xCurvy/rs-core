[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/prover",
  "crates/wasm",
  "crates/witness",
]
# Default host checks cover the pure core and graph evaluator; wasm/prover builds
# remain explicit because they have separate target/feature matrices.
default-members = ["crates/core", "crates/witness"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0-rc.2"
publish = true
repository = "https://github.com/0xCurvy/rs-core"
homepage = "https://github.com/0xCurvy/rs-core"
rust-version = "1.94"

# Pinned, vetted dependency set. Policy: no untrusted cargo deps — only the
# arkworks ZK stack + the upstream production RustCrypto dependency set.
# Poseidon is implemented from circomlib constants (no thin Poseidon crate).
# All versions are exact-pinned ("=x.y.z"); Cargo.lock is committed (exact versions
# + checksums) and cargo-deny gates advisories/licenses/bans/sources (see deny.toml).
[workspace.dependencies]
ark-bn254 = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-ff = { version = "=0.6.0", default-features = false, features = ["std"] }
# Domain A (stealth core): BN254 pairing + secp256k1, via arkworks.
ark-ec = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-groth16 = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-poly = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-relations = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-std = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-secp256k1 = { version = "=0.6.0", default-features = false, features = ["std"] }
# RNG for stealth key/ephemeral generation (rust-random). "js" backend on wasm.
getrandom = { version = "=0.2.17", features = ["js"] }
num-bigint = "=0.5.1"
byteorder = "=1.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
# Note cipher and scalar-native signing (Domain B) — RustCrypto.
aes = "=0.9.2"
ctr = "=0.10.1"
hkdf = "=0.13.0"
hmac = "=0.13.0"
sha2 = "=0.11.0"
zeroize = "=1.9.0"
# wasm-bindgen matches the upstream production version.
wasm-bindgen = "=0.2.126"
# OPT-IN parallelism (`parallel` / `wasm-threads` features only; default builds
# stay single-threaded): rayon fans scans out over announcements and bulk Merkle
# construction out over independent parent pairs at each level;
# wasm-bindgen-rayon bridges the pool to web workers on cross-origin-isolated
# pages (nightly + atomics build — see `scripts/build-wasm.sh web --threads`).
rayon = "=1.12.0"
wasm-bindgen-rayon = "=1.3.0"
# DEV-ONLY second Poseidon oracle: a Circom-compatible light-poseidon fork on
# Arkworks 0.6. Never a production dependency.
pso-poseidon = "=0.4.0"
