[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm"]
# `cargo test` / `cargo clippy` (host) operate on curvy-core; curvy-wasm is built
# explicitly for wasm32 (it only makes sense as a wasm cdylib).
default-members = ["crates/core"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.0.0"
publish = false

# Pinned, vetted dependency set: the arkworks ZK stack + RustCrypto crates only.
# Poseidon is implemented from circomlib constants (no thin Poseidon crate).
# All versions are exact-pinned ("=x.y.z"); Cargo.lock is committed (exact versions
# + checksums) and cargo-deny gates advisories/licenses/bans/sources (see deny.toml).
[workspace.dependencies]
ark-bn254 = { version = "=0.5.0", features = ["std"] }
ark-ff = { version = "=0.5.0", features = ["std"] }
# Stealth core: BN254 pairing + secp256k1, via arkworks.
ark-ec = { version = "=0.5.0", features = ["std"] }
ark-secp256k1 = { version = "=0.5.0", features = ["std"] }
# RNG for stealth key / ephemeral generation. "js" backend on wasm.
getrandom = { version = "=0.2.16", features = ["js"] }
num-bigint = "=0.4.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
# Note cipher (RustCrypto). sha2 0.10 + hkdf 0.12 are the modern RustCrypto line
# (hmac is transitive via hkdf).
aes = "=0.8.4"
ctr = "=0.9.2"
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "=0.10.9"
zeroize = "=1.9.0"
wasm-bindgen = "=0.2.114"
# Opt-in parallelism (`parallel` / `wasm-threads` features only; default builds
# stay single-threaded): rayon fans the scan loop out over announcements, and
# wasm-bindgen-rayon bridges the pool to web workers on cross-origin-isolated pages.
rayon = "=1.12.0"
wasm-bindgen-rayon = "=1.3.0"
# Dev-only second Poseidon reference: Light Protocol's audited (Veridise),
# circom-compatible implementation. Never a production dependency.
light-poseidon = "=0.4.0"
